<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - MyBlog</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">MyBlog</div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="create-post.html" class="btn">Create Post</a></li>
            <!-- The logout button will be handled by script.js -->
            <li><a href="#" id="logoutBtn">Logout</a></li>
        </ul>
    </nav>

    <div class="form-container" style="max-width: 800px;"> <!-- Wider container for posts -->
        <h2>Welcome, <span id="userNameDisplay">User</span>!</h2>
        <p>Manage your blog posts below.</p>
        
        <!-- Search Bar -->
        <input type="text" id="searchInput" placeholder="Search posts by title or content..." style="width: 100%; padding: 10px; margin: 20px 0; border-radius: 5px; border: 1px solid #ccc;">
        
        <!-- Container where script.js will inject the posts -->
        <div id="userPostsList">
            <!-- Posts will be rendered here dynamically -->
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
