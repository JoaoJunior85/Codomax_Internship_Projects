<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Post</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">MyBlog</div>
        <ul class="nav-links">
            <li><a href="dashboard.html">Back to Dashboard</a></li>
        </ul>
    </nav>
    <div class="form-container">
        <h2>Create New Post</h2>
        <form id="postForm">
            <div class="form-group">
                <label>Title:</label>
                <input type="text" required placeholder="Post title">
            </div>
            <div class="form-group">
                <label>Content:</label>
                <textarea rows="5" required placeholder="Write here..."></textarea>
            </div>
            <button type="submit">Publish</button>
        </form>
    </div>
    <script src="js/script.js"></script>
</body>
</html>
