<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Post - MyBlog</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">MyBlog</div>
        <ul class="nav-links">
            <li><a href="dashboard.html">Back to Dashboard</a></li>
        </ul>
    </nav>

    <div class="form-container">
        <h2>Create a New Post</h2>
        <!-- The ID 'postForm' is used by script.js -->
        <form id="postForm">
            <div class="form-group">
                <label for="title">Title:</label>
                <input type="text" id="title" name="title" required placeholder="Enter post title">
            </div>
            <div class="form-group">
                <label for="content">Content:</label>
                <textarea id="content" name="content" rows="6" required placeholder="Write your post content here..."></textarea>
            </div>
            <button type="submit">Publish Post</button>
        </form>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
