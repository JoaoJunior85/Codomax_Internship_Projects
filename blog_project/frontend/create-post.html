<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Post - MyBlog</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Lucide Icons Library -->
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <nav class="navbar">
        <a class="brand" href="index.html"><img src="img/brand-mark.png" alt=""><span>MyBlog</span></a>
        <ul class="nav-links">
            <li><a href="dashboard.html">Back to Dashboard</a></li>
        </ul>
    </nav>

    <div class="form-container">
        <h2>Create a New Post</h2>
        <!-- The ID 'postForm' is used by script.js -->
        <form id="postForm">
            <div class="form-group">
                <label for="title">Title:</label>
                <input type="text" id="title" name="title" required placeholder="Enter post title">
            </div>
            <div class="form-group">
                <label for="imageUrl">Image URL (optional)</label>
                <input type="text" id="imageUrl" name="imageUrl" inputmode="url" placeholder="https://example.com/image.jpg">
                <label for="imageFile" class="file-label">Or choose an image from your device</label>
                <input type="file" id="imageFile" accept="image/png,image/jpeg,image/webp">
                <small class="field-help">PNG, JPG or WebP • maximum 8 MB; optimized automatically.</small>
                <img id="imagePreview" class="image-preview" alt="Selected cover preview" hidden>
            </div>
            <div class="form-group">
                <label for="content">Content:</label>
                <textarea id="content" name="content" rows="6" required placeholder="Write your post content here..."></textarea>
            </div>
            <button type="submit">Publish Post</button>
        </form>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
