<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Post - MyBlog</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Lucide Icons Library -->
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <nav class="navbar">
        <a class="brand" href="index.html"><img src="img/brand-mark.png" alt=""><span>MyBlog</span></a>
        <ul class="nav-links">
            <li><a href="dashboard.html">Cancel & Go Back</a></li>
        </ul>
    </nav>

    <div class="form-container">
        <h2>Edit Post</h2>
        <!-- The ID 'editPostForm' is used by script.js -->
        <form id="editPostForm">
            <div class="form-group">
                <label for="editTitle">Title:</label>
                <input type="text" id="editTitle" name="title" required placeholder="Update title">
            </div>
            <div class="form-group">
                <label for="editImageUrl">Image URL (optional)</label>
                <input type="text" id="editImageUrl" name="imageUrl" inputmode="url" placeholder="https://example.com/image.jpg">
                <label for="editImageFile" class="file-label">Or choose a replacement image from your device</label>
                <input type="file" id="editImageFile" accept="image/png,image/jpeg,image/webp">
                <small class="field-help">PNG, JPG or WebP • maximum 8 MB; optimized automatically.</small>
                <img id="editImagePreview" class="image-preview" alt="Selected cover preview" hidden>
            </div>
            <div class="form-group">
                <label for="editContent">Content:</label>
                <textarea id="editContent" name="content" rows="6" required placeholder="Update content..."></textarea>
            </div>
            <button type="submit" style="background-color: #f59e0b; color: black;">Update Post</button>
        </form>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
