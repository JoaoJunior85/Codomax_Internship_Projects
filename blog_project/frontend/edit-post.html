<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Post - MyBlog</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Lucide Icons Library -->
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <nav class="navbar">
        <div class="logo">MyBlog</div>
        <ul class="nav-links">
            <li><a href="dashboard.html">Cancel & Go Back</a></li>
        </ul>
    </nav>

    <div class="form-container">
        <h2>Edit Post</h2>
        <!-- The ID 'editPostForm' is used by script.js -->
        <form id="editPostForm">
            <div class="form-group">
                <label for="editTitle">Title:</label>
                <input type="text" id="editTitle" name="title" required placeholder="Update title">
            </div>
            <div class="form-group">
                <label for="editImageUrl">Cover Image URL:</label>
                <!-- NEW: Input for the image link -->
                <input type="url" id="editImageUrl" name="imageUrl" placeholder="https://exemplo.com/imagem.jpg">
            </div>
            <div class="form-group">
                <label for="editContent">Content:</label>
                <textarea id="editContent" name="content" rows="6" required placeholder="Update content..."></textarea>
            </div>
            <button type="submit" style="background-color: #f59e0b; color: black;">Update Post</button>
        </form>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
