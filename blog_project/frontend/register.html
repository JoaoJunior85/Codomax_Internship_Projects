<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - MyBlog</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Lucide Icons Library -->
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <nav class="navbar">
        <a class="brand" href="index.html"><img src="img/logo.png" alt=""><span>MyBlog</span></a>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="login.html">Login</a></li>
        </ul>
    </nav>

    <div class="form-container">
        <div class="form-brand"><img src="img/logo.png" alt=""><span>MyBlog</span></div>
        <h2>Create an Account</h2>
        <!-- The ID 'registerForm' is used by script.js -->
        <form id="registerForm">
          <div class="form-group">
    <label for="name">Name:</label>
    <div class="input-wrapper">
        <i data-lucide="user" class="input-icon"></i>
        <input type="text" id="name" name="name" required placeholder="Your full name">
    </div>
</div>

            <div class="form-group">
                <label for="email">Email:</label>
                <div class="input-wrapper">
                    <i data-lucide="mail" class="input-icon"></i>
                    <input type="email" id="email" name="email" required placeholder="your@email.com">
                </div>
            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <div class="input-wrapper">
                    <i data-lucide="lock" class="input-icon"></i>
                    <input type="password" id="password" name="password" required placeholder="Create a strong password">
                </div>
            </div>
            <button type="submit">Register</button>
        </form>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
